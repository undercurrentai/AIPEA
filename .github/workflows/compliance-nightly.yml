# Nightly compliance scans — adapted from Engineering Standards Appendix E.
name: compliance-nightly
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Dependency scan (pip)
        run: |
          pip install safety
          safety check --full-report || true

      - name: Container scan (Trivy full)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: 'fs'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'

      - name: IaC scan (Checkov)
        run: |
          pip install checkov
          checkov --compact -d . --skip-check CKV_GHA_7

      - name: Full mutation testing
        continue-on-error: true  # Informational — mutmut 3.x has enum trampoline bugs
        run: |
          if [ -d tests ]; then pip install mutmut && mutmut run; fi
